# =====================================================================
# 전역 설정 — Phase 0 (사전 진단)
# 부록 A.3: 모든 난수 시드는 여기에 고정하고, 스크립트 시작 시 로그에 찍는다.
# =====================================================================

project: disclosure-sdc
phase: 0

seed: 20260820

paths:
  raw: data/raw            # 원본 ZIP 캐시 (gitignore)
  pilot: data/pilot        # Phase 0 산출물
  pilot_mock: data/pilot_mock   # --mock 실행 시 산출물 (실데이터와 절대 섞지 않는다)

api:
  # OpenDART 인증키는 코드에 넣지 않는다. 환경변수 OPENDART_KEY 또는 .env 에서 읽는다.
  # TODO(API): 키 발급 후 .env.example -> .env 복사 후 값만 채우면 된다.
  key_env: OPENDART_KEY
  base_url: https://opendart.fss.or.kr/api
  sleep_sec: 0.3           # 호출 사이 대기
  max_retries: 3           # 실패 시 지수 백오프 재시도 횟수
  backoff_base_sec: 1.0
  timeout_sec: 30
  daily_limit: 20000       # 참고용. 초과 시 OpenDART가 020 에러를 반환한다.

sample:
  fiscal_years: [2016, 2020, 2024]
  report_name_include: ["사업보고서"]
  report_name_exclude: ["분기보고서", "반기보고서", "분기", "반기"]
  # 정정보고서는 별도 플래그(is_amendment)로 표시하되 원본을 우선 사용한다.
  prefer_original_over_amendment: true

# ---------------------------------------------------------------------
# 진단 대상 4개 섹션 (0.1 D1)
# 중요: 섹션 번호(로마숫자)는 연도마다 바뀐다. 번호가 아니라 '이름'으로 매칭한다.
# ---------------------------------------------------------------------
sections:
  S1:
    name: "사업의 내용"
    aliases: ["사업의 내용", "사업의내용"]
  S2:
    name: "이사의 경영진단 및 분석의견"
    aliases: ["이사의 경영진단 및 분석의견", "경영진단 및 분석의견"]
  S3:
    name: "그 밖에 투자자 보호를 위하여 필요한 사항"
    aliases: ["그 밖에 투자자 보호를 위하여 필요한 사항", "그밖에 투자자보호를 위하여 필요한 사항"]
  S4:
    name: "임원 및 직원 등에 관한 사항"
    aliases: ["임원 및 직원 등에 관한 사항", "임원 및 직원에 관한 사항"]

# P0-e — Gate 0 종료
gate0_close:
  # 잔재 제거 전/후 비교용 코퍼스. 제거 전은 P0-c 가 남긴 sections_fixed/ 다.
  corpus_before: sections_fixed
  corpus_after: sections
  taxonomy_sample: 20             # '기타' 로 분류된 것 중 사람이 볼 샘플 수

# ---------------------------------------------------------------------
# 파싱 옵션 (P0-c Part 2~3)
# ---------------------------------------------------------------------
parse:
  # 종료 헤더(다음 최상위 섹션)를 못 찾으면 found=False 로 강등한다.
  # 시작만 찾고 문서 끝까지 흘러 재무제표 주석이 섞여 들어오는 것을 막는다.
  require_terminator: true
  # 이보다 짧은 문단은 앞 문단에 병합한다. 표 셀 파편/괄호 조각 제거용.
  merge_min_chars: 10
  parser: html.parser

# ---------------------------------------------------------------------
# 경계 감사 (P0-c)
# ---------------------------------------------------------------------
audit:
  snippet_chars: 200              # boundary_audit.csv 의 첫/마지막 발췌 길이
  contamination_share_max: 0.10   # 오염 문단 비중 임계값 (초과 시 나열)
  corp_dominance_max: 0.20        # 한 corp_code 가 전체 쌍의 이 비율 초과 시 경고
  # 회계기준 주석이 섞여 들어왔는지 보는 마커. 섹션마다 세트가 다르다 (P0-d Part A-2).
  # default 는 S1/S3/S4 에 적용된다.
  contamination_markers:
    default:
      - 기대신용손실
      - 공정가치 서열체계
      - 금융상품의 범주
      - 이연법인세자산
      - 리스부채
      - 재무제표 작성기준
      - 한국채택국제회계기준
      - 손상차손
      - 유효이자율
    # S2(경영진단)에서는 리스부채·한국채택국제회계기준·손상차손·재무제표 작성기준이
    # 정상적으로 언급될 수 있다. 주석 유입의 신호로 보기 어려우므로 제외한다.
    S2:
      - 기대신용손실
      - 공정가치 서열체계
      - 금융상품의 범주
      - 유효이자율

manual_review:
  n_docs: 20                      # 수동 검수 표본 문서 수
  snippet_chars: 300
  # 브라우저에서 내려받은 검수 결과 JSON. 있으면 이것을 1순위로 읽는다.
  result_json: data/pilot/manual_review_result.json
  # JSON 이 없을 때 쓰는 기록. 출처를 반드시 남긴다 (재현 불가 데이터이므로).
  reported:
    source: "연구자 구두 보고 (2026-08-21). 브라우저 JSON 은 export 되지 않음."
    n_items: 80                   # 20개 문서 x 4개 섹션
    n_ok: 80
    n_ng: 0

# Gate 0 통과 조건 (문서 'Gate 0 — 통과 조건')
gate0:
  parse_success_rate_min: 0.85
  s1_mean_chars_min: 5000
  s2_drop_threshold_chars: 2000     # 미만이면 MVP 섹션에서 제외 확정
  section_mean_chars_min: 2000      # D1 일반 기준
  change_rate_median_min: 0.05      # D1 변화율 기준
  parse_rate_reset_period: 0.70     # 미만이면 표본 시작연도를 2018년으로 올린다

# P0-b 스파이크/공통문단 진단 파라미터
change:
  tfidf_char_ngram: [2, 2]          # 한국어: 형태소 분석 없이 문자 2-gram
  minhash_num_perm: 128
  minhash_ngram: 3                  # 문자 3-gram
  minhash_threshold: 0.8
  top_pairs: 20                     # 리포트에 표시할 상위 쌍 수
  max_pairs_stored: 500             # (섹션 x 연도쌍)당 CSV로 저장할 최대 쌍 수.
                                    # 서식개정 연도에는 쌍이 수만 개까지 나온다.
  min_paragraph_chars: 30           # 너무 짧은 문단은 공통문단 탐지에서 제외

# ---------------------------------------------------------------------
