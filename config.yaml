# =====================================================================
# Phase 1 — 데이터 인프라
# =====================================================================
phase1:
  fiscal_years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  top_n_by_mcap: 800            # 각 회계연도 말 기준 시총 상위 N
  # 과거 시점 시가총액을 어떻게 구할지. 정해지기 전에는 유니버스를 확정하지 않는다.
  #   unset                          -> snapshot() 이 명시적으로 실패한다 (기본)
  #   yearend_close_x_current_shares -> 연도말 종가 x 현재 주식수 (근사)
  #   krx_login                      -> KRX_ID/KRX_PW 로 pykrx 시총 API 사용
  mcap_method: krx_login
  markets: [KOSPI, KOSDAQ]
  exclude_sectors: ["금융업"]    # KRX 업종 대분류
  exclude_name_patterns:        # 스팩/우선주/리츠 제외
    - "스팩"
    - "제[0-9]+호"
    - "우$"
    - "우[BC]$"
    - "[0-9]우$"
    - "리츠"
  december_fiscal_only: true

  paths:
    filings: data/raw/filings           # {rcept_no}.zip
    prices: data/raw/prices
    meta: data/meta                     # universe_{year}.parquet, filings_index.parquet
    reference: data/reference           # 공정위 기업집단 원자료 (수동 배치)
    corpus: data/corpus                 # 파싱 결과

  api_quota:
    # 20,000 중 5,000 을 여유로 남긴다. 재시도·재실행 여지가 필요하다.
    daily_limit: 15000
    counter_file: data/meta/dart_call_counter.json

  # 사용자 요구 1) 공정위 대규모기업집단 -> 계열 관계 통제 (Phase 5 계열사 쌍 제외)
  affiliates:
    # 공정위 지정 자료는 연도별 스냅샷으로 관리한다.
    # TODO(API): data.go.kr 공정거래위원회 오픈API 키가 생기면 자동 수집으로 교체.
    #            그 전까지는 아래 경로에 연도별 파일을 수동으로 둔다.
    #   data/reference/fair_trade_groups_{year}.csv
    #   컬럼: group_name, corp_name  (그 외 컬럼은 무시)
    source_glob: "fair_trade_groups_*.csv"
    out: data/meta/affiliate_groups.parquet
    name_match_threshold: 92            # 기업명 퍼지 매칭 임계값
    review_bottom_n: 50                 # 퍼지 점수 하위 N건은 사람이 검수한다

  # 사용자 요구 2) 편집기 잔재 제거 적용 + 제거 전 텍스트 병행 보관
  keep_raw_text: true                   # data/corpus/raw_text/ 에 제거 전 텍스트 보관

  # 사용자 요구 3) S4 는 텍스트가 아니라 표를 구조화 데이터로
  officers:
    section: S4
    out: data/panel/officers.parquet
    columns: [corp_code, fy, rcept_no, name, position, is_registered,
              tenure_raw, tenure_months, term_end_raw, full_time, duty]
